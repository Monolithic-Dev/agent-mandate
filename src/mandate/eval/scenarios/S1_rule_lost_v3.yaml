  event: owner_say
  text: You may read and archive my email, but confirm with me before deleting anything.
- t: 5000
  event: owner_say
  text: How is the weather today?
- t: 6000
  event: owner_say
  text: Please remember to be polite in every reply.
- t: 30000
  event: compact
- t: 40000
  event: owner_say
